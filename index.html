<style>
  :root{
    --saffron:#e07a2c;
    --gold:#c9a227;
    --deep:#1b2a4a;
    --deep2:#26395e;
    --paper:#fbf7ef;
    --card:#ffffff;
    --ink:#22252b;
    --muted:#6b7280;
    --line:#e7e0d2;
    --good:#2f7d5c;
    --danger:#b3452f;
    --radius:16px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(180deg,var(--deep) 0%, var(--deep) 120px, var(--paper) 120px);
    color:var(--ink); min-height:100%;
  }
  #app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--paper);}
  header.topbar{
    padding:18px 18px 14px;color:#fff;
    background:linear-gradient(135deg,var(--deep),var(--deep2));
    position:sticky;top:0;z-index:20;
  }
  header.topbar h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.2px;}
  header.topbar .sub{font-size:12.5px;opacity:.85;margin-top:3px;}
  main{flex:1;padding:14px 14px calc(90px + var(--safe-bottom));}
  nav.tabs{
    position:fixed;left:0;right:0;bottom:0;
    max-width:520px;margin:0 auto;
    display:flex;background:#fff;border-top:1px solid var(--line);
    padding-bottom:var(--safe-bottom);
    box-shadow:0 -4px 16px rgba(0,0,0,.06);
    z-index:30;
  }
  nav.tabs button{
    flex:1;border:none;background:none;padding:9px 2px 8px;font-size:10.5px;color:var(--muted);
    display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;
  }
  nav.tabs button .ic{font-size:19px;}
  nav.tabs button.active{color:var(--saffron);}
  h2.section-title{font-size:17px;margin:2px 0 12px;color:var(--deep);}
  .card{background:var(--card);border-radius:var(--radius);padding:14px 15px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid var(--line);}
  .pill{display:inline-block;background:#f3ead9;color:var(--saffron);font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;margin-right:6px;}
  .pill.green{background:#e4f2ea;color:var(--good);}
  .pill.blue{background:#e6eefc;color:#2454a3;}
  .muted{color:var(--muted);font-size:12.5px;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .btn{
    border:none;background:var(--deep);color:#fff;padding:10px 14px;border-radius:12px;font-size:13.5px;font-weight:700;
  }
  .btn.secondary{background:#f0ece1;color:var(--deep);}
  .btn.ghost{background:none;color:var(--saffron);padding:6px 8px;font-weight:700;}
  .btn.small{padding:7px 10px;font-size:12px;}
  .btn.danger{background:var(--danger);color:#fff;}
  .btn.block{width:100%;}
  input,select,textarea{
    width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#fff;color:var(--ink);font-family:inherit;
  }
  textarea{resize:vertical;min-height:60px;}
  label.field{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px;}
  .chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;}
  .chip{flex:none;padding:8px 13px;border-radius:20px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted);}
  .chip.active{background:var(--deep);color:#fff;border-color:var(--deep);}
  .day-card .date{font-size:11.5px;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:.4px;}
  .day-card h3{margin:2px 0 4px;font-size:15.5px;color:var(--deep);}
  .day-card .loc{font-size:12.5px;color:var(--muted);margin-bottom:6px;}
  .day-card p{font-size:13.5px;line-height:1.45;margin:6px 0;}
  .tips{margin:8px 0 0;padding:0;list-style:none;}
  .tips li{font-size:12.5px;line-height:1.4;padding:5px 0 5px 20px;position:relative;color:#3a3d44;}
  .tips li:before{content:"✓";position:absolute;left:0;color:var(--good);font-weight:900;}
  .doc-item{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);}
  .doc-item:first-child{border-top:none;}
  .thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;background:#eee;flex:none;border:1px solid var(--line);}
  .thumb.placeholder{display:flex;align-items:center;justify-content:center;font-size:22px;}
  .doc-info{flex:1;min-width:0;}
  .doc-info .t{font-weight:700;font-size:13.5px;}
  .doc-info .m{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:30px 10px;}
  .modal-bg{position:fixed;inset:0;background:rgba(20,20,25,.55);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
  .modal{background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 18px calc(22px + var(--safe-bottom));max-height:88vh;overflow-y:auto;}
  .modal h3{margin:0 0 12px;font-size:16.5px;color:var(--deep);}
  .modal-actions{display:flex;gap:8px;margin-top:14px;}
  .modal-actions .btn{flex:1;}
  .close-x{position:absolute;top:10px;right:14px;font-size:20px;background:none;border:none;color:var(--muted);}
  .guide-stop{border-top:1px solid var(--line);padding:12px 0;}
  .guide-stop:first-child{border-top:none;}
  .guide-stop.current{background:#fff7ea;border-radius:10px;padding:12px;margin:0 -12px;}
  .guide-stop h4{margin:0 0 5px;font-size:13.5px;color:var(--deep);}
  .guide-stop p{margin:0;font-size:13px;line-height:1.5;color:#333;}
  .player-bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 4px;display:flex;align-items:center;justify-content:center;gap:14px;border-radius:14px;margin-top:10px;box-shadow:0 -2px 10px rgba(0,0,0,.05);}
  .player-bar button{background:var(--deep);color:#fff;border:none;width:44px;height:44px;border-radius:50%;font-size:17px;}
  .player-bar button.big{width:54px;height:54px;font-size:20px;background:var(--saffron);}
  .checklist-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px;}
  .checklist-item:first-child{border-top:none;}
  .checklist-item input{width:19px;height:19px;flex:none;}
  .checklist-item.checked span{text-decoration:line-through;color:var(--muted);}
  .info-block h4{margin:14px 0 4px;color:var(--deep);font-size:14px;}
  .info-block p, .info-block li{font-size:13px;line-height:1.5;color:#3a3d44;}
  .info-block ul{margin:4px 0;padding-left:18px;}
  .banner{background:#fff7ea;border:1px solid #f0dcae;border-radius:14px;padding:12px 14px;font-size:12.5px;line-height:1.5;margin-bottom:12px;color:#5a4a1f;}
  .banner b{color:#8a5c0a;}
  .traveler-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px;}
  .traveler-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700;color:var(--deep);}
  .traveler-card .r{font-weight:500;color:var(--muted);font-size:11.5px;}
  .flex-between{display:flex;justify-content:space-between;align-items:center;}
  a{color:var(--saffron);}
  .toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#22252b;color:#fff;padding:10px 18px;border-radius:30px;font-size:13px;z-index:200;box-shadow:0 4px 14px rgba(0,0,0,.25);}
</style>

/* ============ INDEXEDDB (photos) ============ */
let _db;
function openDB(){
  return new Promise((resolve,reject)=>{
    if(_db) return resolve(_db);
    const req = indexedDB.open('travelAppPhotosDB', 1);
    req.onupgradeneeded = e => { e.target.result.createObjectStore('photos'); };
    req.onsuccess = e => { _db = e.target.result; resolve(_db); };
    req.onerror = e => reject(e);
  });
}
function idbPut(id, blob){ return openDB().then(d=>new Promise((res,rej)=>{ const tx=d.transaction('photos','readwrite'); tx.objectStore('photos').put(blob, id); tx.oncomplete=()=>res(); tx.onerror=e=>rej(e); })); }
function idbGet(id){ return openDB().then(d=>new Promise((res,rej)=>{ const tx=d.transaction('photos','readonly'); const rq=tx.objectStore('photos').get(id); rq.onsuccess=()=>res(rq.result); rq.onerror=e=>rej(e); })); }
function idbDelete(id){ return openDB().then(d=>new Promise((res,rej)=>{ const tx=d.transaction('photos','readwrite'); tx.objectStore('photos').delete(id); tx.oncomplete=()=>res(); tx.onerror=e=>rej(e); })); }

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function resizeImage(file){
  return new Promise((resolve)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let {width,height} = img;
        const maxDim = 1400;
        if(width > maxDim || height > maxDim){
          const scale = maxDim / Math.max(width,height);
          width = Math.round(width*scale); height = Math.round(height*scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img,0,0,width,height);
        canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.75);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
function blobToBase64(blob){ return new Promise(res=>{ const r=new FileReader(); r.onloadend=()=>res(r.result); r.readAsDataURL(blob); }); }
function dataURLToBlob(dataurl){
  const parts = dataurl.split(',');
  const mime = parts[0].match(/:(.*?);/)[1];
  const bstr = atob(parts[1]);
  let n = bstr.length; const u8 = new Uint8Array(n);
  while(n--){ u8[n] = bstr.charCodeAt(n); }
  return new Blob([u8], {type:mime});
}

/* ============ HELPERS ============ */
function fmtDate(iso){
  const d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'});
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function daysUntil(iso){
  const a = new Date(todayISO()+"T00:00:00"), b = new Date(iso+"T00:00:00");
  return Math.round((b-a)/86400000);
}

window.openArrivalDoc = function(personId, docType){
  const person = ARRIVAL_DOCS[personId]; if(!person) return;
  const data = docType === 'health' ? person.health : person.earrival;
  if(!data){ 
    showModal(docType==='health'?'🏥 Health Declaration':'🛂 e-Arrival Card',
      '<div style="padding:8px 0;text-align:center;">' +
      '<div style="font-size:40px;margin-bottom:12px;">' + (docType==='health'?'🏥':'🛂') + '</div>' +
      '<div style="font-size:14px;font-weight:700;color:var(--deep);margin-bottom:8px;">Document available in your email</div>' +
      '<div style="font-size:13px;color:var(--muted);line-height:1.7;">Your ' + (docType==='health'?'Air Suvidha Health Declaration':'e-Arrival Card') + ' PDF was sent to marc@bennettdental.com.<br><br>' +
      'ACAN: <b style=\'color:var(--deep)\'>' + person.acan + '</b><br>' +
      'Health Reg: <b style=\'color:var(--deep)\'>' + person.healthReg + '</b>' +
      '</div></div>');
    return;
  }
  try {
    const base64 = data.split(',')[1];
    const byteStr = atob(base64);
    const bytes = new Uint8Array(byteStr.length);
    for(let i=0;i<byteStr.length;i++) bytes[i]=byteStr.charCodeAt(i);
    const blob = new Blob([bytes],{type:'application/pdf'});
    window.open(URL.createObjectURL(blob),'_blank');
  } catch(e){ window.open(data,'_blank'); }
};

function renderItinerary(main){
  main.innerHTML = `<h2 class="section-title">Day by day</h2><div id="dayList"></div>`;
  const list = document.getElementById('dayList');
  list.innerHTML = ITINERARY.map(d=>{
    const isToday = d.date===todayISO();

    // Flight/hotel inline banners
    const flightBanners = (d.flightRefs||[]).map(grp=>{
      const f = CONFIRMED_FLIGHTS.find(b=>b.group===grp);
      if(!f) return '';
      const leg0 = f.legs[0], legN = f.legs[f.legs.length-1];
      const summary = `${leg0.from.split('(')[0].trim()} → ${legN.to.split('(')[0].trim()} · ${leg0.departs.split('·')[1]?.trim()||leg0.departs}`;
      const escapedGrp = grp.replace(/'/g, "\\'");
      return `<button onclick="openFlightModal('${escapedGrp}')" style="display:flex;align-items:center;gap:8px;width:100%;background:var(--color-background-secondary,#f8f5ef);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px;cursor:pointer;text-align:left;">
        <span style="font-size:16px;">✈️</span>
        <div style="flex:1;min-width:0;">
          <div style="font-size:12px;font-weight:700;color:var(--deep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${summary}</div>
          <div style="font-size:11px;color:var(--muted);">${f.airline} · tap for details</div>
        </div>
        <span style="color:var(--saffron);font-size:14px;">›</span>
      </button>`;
    }).join('');

    const hotelBanner = d.hotelRef ? (()=>{
      const h = HOTELS.find(x=>x.name===d.hotelRef);
      if(!h) return '';
      const escapedHotel = d.hotelRef.replace(/'/g, "\\'");
      return `<button onclick="openHotelModal('${escapedHotel}')" style="display:flex;align-items:center;gap:8px;width:100%;background:var(--color-background-secondary,#f8f5ef);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px;cursor:pointer;text-align:left;">
        <span style="font-size:16px;">🏨</span>
        <div style="flex:1;min-width:0;">
          <div style="font-size:12px;font-weight:700;color:var(--deep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${h.name}</div>
          <div style="font-size:11px;color:var(--muted);">Check-in ${h.checkin.split('·')[1]?.trim()||h.checkin} · tap for details</div>
        </div>
        <span style="color:var(--saffron);font-size:14px;">›</span>
      </button>`;
    })() : '';

    const parkingBanner = d.parkingRef ? `<button onclick="openParkingModal()" style="display:flex;align-items:center;gap:8px;width:100%;background:var(--color-background-secondary,#f8f5ef);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px;cursor:pointer;text-align:left;">
      <span style="font-size:16px;">🅿️</span>
      <div style="flex:1;min-width:0;">
        <div style="font-size:12px;font-weight:700;color:var(--deep);">Park2Go Value Valet · ${d.date==='2026-08-01'?'Drop-off 8:30am — White Ford F-150':'Text for pickup on landing · Post 24 (Dom) or Post 38 (Intl)'}</div>
        <div style="font-size:11px;color:var(--muted);">Res #8825333 · CSM2229 (AB) · tap for details & voucher</div>
      </div>
      <span style="color:var(--saffron);font-size:14px;">›</span>
    </button>` : '';

    const scheduleHtml = d.schedule ? `
      <div style="margin:10px 0 4px;">
        <div style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--saffron);margin-bottom:8px;">📅 Day Schedule</div>

          ${d.schedule.map((s,i)=>`
            <div style="display:flex;gap:10px;margin-bottom:${i===d.schedule.length-1?'0':'8px'};align-items:flex-start;">
              <div style="min-width:68px;font-size:11px;font-weight:700;color:var(--saffron);padding-top:1px;white-space:nowrap;">${s.time}</div>
              <div style="font-size:12.5px;color:var(--ink);line-height:1.4;">${s.act}</div>
            </div>
          `).join('')}
        </div>
      </div>` : '';

    const tipsHtml = d.tips && d.tips.length ? `
      <div style="margin-top:8px;">
        <div style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:6px;">💡 Tips & reminders</div>
        <ul class="tips">${d.tips.map(t=>`<li>${t}</li>`).join('')}</ul>

    return `<div class="card day-card" style="${isToday?'border-color:var(--saffron);border-width:2px;':''}">

      ${flightBanners}${hotelBanner}${parkingBanner}
      ${scheduleHtml}
      ${tipsHtml}
    </div>`;
  }).join('');
}

/* ============ PRE-ARRIVAL ============ */

function renderPreArrival(main){
  const now = new Date();
  const arrivalMs = PRE_ARRIVAL_CONFIG.arrivalIndia.getTime();
  const windowMs = PRE_ARRIVAL_CONFIG.windowHours * 60 * 60 * 1000;
  const windowOpenMs = arrivalMs - windowMs;
  const windowOpen = now >= windowOpenMs;
  const msUntilWindow = windowOpenMs - now;
  const hoursUntilWindow = Math.floor(msUntilWindow / 3600000);
  const minsUntilWindow = Math.floor((msUntilWindow % 3600000) / 60000);

  // Load completion state
  if(!state.preArrival) state.preArrival = {};

  function isComplete(portalKey, travelerId){
    return !!(state.preArrival[portalKey + '_' + travelerId]);
  }
  function toggleComplete(portalKey, travelerId){
    const k = portalKey + '_' + travelerId;
    state.preArrival[k] = !state.preArrival[k];
    saveState();
    renderPreArrival(main);
  }

  const totalTasks = PRE_ARRIVAL_CONFIG.portals.length * 6;
  const completedTasks = PRE_ARRIVAL_CONFIG.portals.reduce((acc, p) =>
    acc + TRAVELERS.filter(t => isComplete(p.key, t.id)).length, 0);
  const allDone = completedTasks === totalTasks;

  main.innerHTML = `
    <h2 class="section-title">📋 Pre-Arrival Requirements — India</h2>

    <!-- Overall progress -->
    <div class="card" style="margin-bottom:14px;${allDone?'border:2px solid #1a7a3c;':''}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <span style="font-size:14px;font-weight:800;color:var(--deep);">${allDone ? '🎉 All done!' : `${completedTasks} of ${totalTasks} submissions complete`}</span>
        <span style="font-size:13px;font-weight:700;${allDone?'color:#1a7a3c;':'color:var(--saffron);'}">${Math.round(completedTasks/totalTasks*100)}%</span>
      </div>
      <div style="background:var(--line);border-radius:99px;height:8px;overflow:hidden;">
        <div style="height:100%;width:${Math.round(completedTasks/totalTasks*100)}%;background:${allDone?'#1a7a3c':'var(--saffron)'};border-radius:99px;transition:width .4s;"></div>
      </div>
    </div>

    <!-- Submission window countdown -->
    <div class="card" style="margin-bottom:14px;background:${windowOpen?'#f0faf4':'#fff8e6'};border:2px solid ${windowOpen?'#1a7a3c':'var(--saffron)'};">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
        <span style="font-size:22px;">${windowOpen ? '🟢' : '🟡'}</span>
        <div>
          <div style="font-size:14px;font-weight:800;color:${windowOpen?'#1a7a3c':'var(--deep)'};">
            ${windowOpen ? 'Submission window is NOW OPEN ✓' : 'Submission window opens in:'}
          </div>
          ${!windowOpen ? `<div style="font-size:20px;font-weight:800;color:var(--saffron);letter-spacing:1px;">${hoursUntilWindow}h ${minsUntilWindow}m</div>` : ''}
        </div>
      </div>
      <div style="font-size:12px;color:var(--muted);">
        ✈ AC42 arrives Delhi: <b style="color:var(--ink)">Aug 2, 7:50pm IST</b><br>
        📅 72-hour window opens: <b style="color:var(--ink)">Jul 30, 7:50pm IST</b> (Jul 30, ~8:20am MDT)<br>
        ${windowOpen ? '<b style="color:#1a7a3c;">Complete all submissions now for all 6 travellers.</b>' : 'Complete all submissions as soon as this window opens.'}
      </div>
    </div>

    <!-- Each portal -->
    ${PRE_ARRIVAL_CONFIG.portals.map(p => {
      const portalDone = TRAVELERS.every(t => isComplete(p.key, t.id));
      return `
        <div class="card" style="margin-bottom:14px;${portalDone?'border:1.5px solid #1a7a3c;':''}">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;">
            <div>
              <div style="font-size:15px;font-weight:800;color:var(--deep);">${p.icon} ${p.name}</div>
              <div style="font-size:11px;color:var(--muted);margin-top:2px;">${p.authority}</div>
            </div>
            ${portalDone ? '<span style="font-size:11px;font-weight:700;color:#1a7a3c;background:#d4f5e1;padding:3px 10px;border-radius:20px;">ALL DONE ✓</span>' : ''}
          </div>
          <div style="font-size:12.5px;color:var(--muted);margin-bottom:10px;">${p.desc}</div>

          <!-- Portal link — green when window open -->
          <a href="${p.url}" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;text-decoration:none;background:${windowOpen?'#1a7a3c':'#e8e6df'};margin-bottom:8px;">
            <span style="font-size:18px;">🌐</span>
            <div style="flex:1;">
              <div style="font-size:13px;font-weight:700;color:${windowOpen?'#fff':'var(--deep)'};">${p.url.replace('https://','')}</div>
              <div style="font-size:11px;color:${windowOpen?'rgba(255,255,255,0.8)':'var(--muted)'};">${windowOpen ? '✓ Window is open — tap to submit now' : 'Window not yet open — available Jul 30'}</div>
            </div>
            <span style="color:${windowOpen?'#fff':'var(--muted)'};font-size:16px;">↗</span>
          </a>
          ${p.appName ? `
            <div style="font-size:11.5px;color:var(--muted);margin-bottom:10px;">Also available via: <b style="color:var(--ink)">${p.appName}</b></div>
          ` : ''}

          <!-- Per-person checklist -->
          <div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:6px;">Mark submitted for each traveller:</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">
            ${TRAVELERS.map(t => {
              const done = isComplete(p.key, t.id);
              return `
                <button onclick="preArrivalToggle('${p.key}','${t.id}')"
                  style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;border:1.5px solid ${done?'#1a7a3c':'var(--line)'};background:${done?'#f0faf4':'var(--bg2)'};cursor:pointer;text-align:left;">
                  <span style="font-size:16px;">${done?'✅':'⬜'}</span>
                  <div>
                    <div style="font-size:12.5px;font-weight:700;color:${done?'#1a7a3c':'var(--deep)'};">${t.name}</div>
                    <div style="font-size:10.5px;color:var(--muted);">${done?'Submitted ✓':'Not yet'}</div>
                  </div>
                </button>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }).join('')}

    <div class="banner" style="margin-top:4px;">
      <b>Important:</b> Each person must submit their own e-Arrival card and health declaration separately. Have passport numbers and flight details (AC42, arriving Delhi Aug 2 7:50pm) ready. The Su-Swagatam app can be pre-filled and submitted when the window opens.
    </div>
  `;

  // Expose toggle function globally
  window.preArrivalToggle = function(portalKey, travelerId){
    if(!state.preArrival) state.preArrival = {};
    const k = portalKey + '_' + travelerId;
    state.preArrival[k] = !state.preArrival[k];
    saveState();
    renderPreArrival(main);
  };
}

/* ============ JOURNAL ============ */
let journalPerson = null;
let journalDayKey = null;

function journalKey(person, date){ return 'journal_' + person + '_' + date; }
function journalGet(person, date){ return state.journal && state.journal[journalKey(person,date)] || {}; }
function journalSet(person, date, data){
  if(!state.journal) state.journal = {};
  state.journal[journalKey(person,date)] = data;
  saveState();
}
function journalEntryCount(person, date){
  const e = journalGet(person, date);
  return Object.values(e).filter(v=>v && v.trim().length > 0).length;
}

function renderJournal(main){
  // If no person selected, show person picker
  if(!journalPerson){
    main.innerHTML = `
      <h2 class="section-title">📓 Trip Journal</h2>
      <p class="muted" style="margin:-4px 0 16px;font-size:13px;line-height:1.6;">A personal space to capture thoughts, reflections, and memories from each day of the trip. Each family member has their own private entries.</p>
      <div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:10px;">Who is writing?</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        ${TRAVELERS.map(t=>`
          <button onclick="journalPerson='${t.id}';journalDayKey=null;renderJournal(document.getElementById('main'))"
            style="padding:18px 10px;background:var(--color-background-secondary,#f8f5ef);border:2px solid var(--line);border-radius:14px;cursor:pointer;text-align:center;">
            <div style="font-size:24px;margin-bottom:6px;">${{marc:'👨',natasha:'👩',courtney:'👩',jordyn:'👩',scarlett:'👧',milo:'👦'}[t.id]||'🧑'}</div>
            <div style="font-size:14px;font-weight:800;color:var(--deep);">${t.name}</div>
            <div style="font-size:11px;color:var(--muted);margin-top:3px;">${JOURNAL_DATA.reduce((n,d)=>n+(journalEntryCount(t.id,d.date)>0?1:0),0)} days written</div>
          </button>
        `).join('')}
      </div>`;
    return;
  }

  // If person selected but no day, show day list
  if(!journalDayKey){
    const traveler = TRAVELERS.find(t=>t.id===journalPerson);
    main.innerHTML = `
      <button onclick="journalPerson=null;renderJournal(document.getElementById('main'))"
        style="display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--saffron);font-size:14px;font-weight:700;cursor:pointer;padding:0;margin-bottom:16px;">
        ← Change person
      </button>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
        <span style="font-size:28px;">${{marc:'👨',natasha:'👩',courtney:'👩',jordyn:'👩',scarlett:'👧',milo:'👦'}[journalPerson]||'🧑'}</span>
        <div>
          <div style="font-size:18px;font-weight:800;color:var(--deep);">${traveler.name}'s Journal</div>
          <div style="font-size:12px;color:var(--muted);">India & Egypt · August 2026</div>
        </div>
      </div>
      ${JOURNAL_DATA.map(d=>{
        const count = journalEntryCount(journalPerson, d.date);
        const total = d.questions.length + 2; // questions + word + family
        const pct = Math.round(count/total*100);
        return `
          <button onclick="journalDayKey='${d.date}';renderJournal(document.getElementById('main'))"
            style="display:flex;align-items:center;gap:12px;width:100%;background:var(--color-background-secondary,#f8f5ef);border:1.5px solid ${count>0?'var(--saffron)':'var(--line)'};border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;text-align:left;">
            <span style="font-size:22px;flex-shrink:0;">${d.emoji}</span>
            <div style="flex:1;min-width:0;">
              <div style="font-size:13px;font-weight:700;color:var(--deep);">${fmtDate(d.date)}</div>
              <div style="font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${d.title}</div>
              ${count>0 ? `
                <div style="margin-top:5px;background:var(--line);border-radius:99px;height:4px;overflow:hidden;">
                  <div style="height:100%;width:${pct}%;background:var(--saffron);border-radius:99px;"></div>
                </div>` :
                `<div style="font-size:11px;color:var(--muted);margin-top:3px;">Tap to write</div>`}
            </div>
            <span style="color:var(--saffron);font-size:16px;flex-shrink:0;">${count>0?'✏️':'›'}</span>
          </button>`;
      }).join('')}`;
    return;
  }

  // Day entry view
  const day = JOURNAL_DATA.find(d=>d.date===journalDayKey);
  const traveler = TRAVELERS.find(t=>t.id===journalPerson);
  const entry = journalGet(journalPerson, journalDayKey);

  function save(){
    const data = {};
    data['word'] = document.getElementById('j_word')?.value||'';
    day.questions.forEach((_,i)=>{ data['q'+i] = document.getElementById('j_q'+i)?.value||''; });
    data['free'] = document.getElementById('j_free')?.value||'';
    data['family'] = document.getElementById('j_family')?.value||'';
    journalSet(journalPerson, journalDayKey, data);
    showToast('Entry saved ✓');
  }

  main.innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;">
      <button onclick="journalDayKey=null;renderJournal(document.getElementById('main'))"
        style="background:none;border:none;color:var(--saffron);font-size:14px;font-weight:700;cursor:pointer;padding:0;">
        ← ${traveler.name}'s Journal
      </button>
    </div>

    <div style="background:linear-gradient(135deg,var(--deep),#2a4a6a);border-radius:16px;padding:16px 18px;margin-bottom:16px;">
      <div style="font-size:24px;margin-bottom:4px;">${day.emoji}</div>
      <div style="font-size:17px;font-weight:800;color:#fff;">${day.title}</div>
      <div style="font-size:12px;color:rgba(255,255,255,.65);margin-top:2px;">${fmtDate(day.date)} · ${traveler.name}'s entry</div>
    </div>

    <!-- One word -->
    <div class="card" style="margin-bottom:12px;">
      <div style="font-size:12px;font-weight:800;color:var(--saffron);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px;">⭐ One word to describe today</div>
      <input id="j_word" type="text" value="${entry.word||''}" placeholder="e.g. Overwhelming, Sacred, Alive..."

function renderPreArrivalInline(target){
  const now = new Date();
  const arrivalMs = PRE_ARRIVAL_CONFIG.arrivalIndia.getTime();
  const windowOpenMs = arrivalMs - (PRE_ARRIVAL_CONFIG.windowHours*3600000);
  const windowOpen = now >= windowOpenMs;
  const msUntilWindow = windowOpenMs - now;
  const hUntil = Math.floor(msUntilWindow/3600000);
  const mUntil = Math.floor((msUntilWindow%3600000)/60000);
  if(!state.preArrival) state.preArrival={};
  const total = PRE_ARRIVAL_CONFIG.portals.length*6;
  const done = PRE_ARRIVAL_CONFIG.portals.reduce((a,p)=>a+TRAVELERS.filter(t=>state.preArrival[p.key+'_'+t.id]).length,0);
  const allDone = done===total;
  target.innerHTML = `
    <div class="card" style="${allDone?'border:2px solid #1a7a3c;':''}margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <span style="font-size:14px;font-weight:800;color:var(--deep);">${allDone?'🎉 All done!':done+' of '+total+' complete'}</span>
        <span style="font-size:13px;font-weight:700;${allDone?'color:#1a7a3c;':'color:var(--saffron);'}">${Math.round(done/total*100)}%</span>
      </div>
      <div style="background:var(--line);border-radius:99px;height:8px;overflow:hidden;">
        <div style="height:100%;width:${Math.round(done/total*100)}%;background:${allDone?'#1a7a3c':'var(--saffron)'};border-radius:99px;"></div>
      </div>
    </div>
    <div class="card" style="margin-bottom:12px;background:${windowOpen?'#f0faf4':'#fff8e6'};border:2px solid ${windowOpen?'#1a7a3c':'var(--saffron)'};">
      <div style="display:flex;align-items:center;gap:10px;">
        <span style="font-size:22px;">${windowOpen?'🟢':'🟡'}</span>
        <div>
          <div style="font-size:13px;font-weight:800;color:${windowOpen?'#1a7a3c':'var(--deep)'};">${windowOpen?'Submission window NOW OPEN ✓':'Window opens in '+hUntil+'h '+mUntil+'m'}</div>
          <div style="font-size:11.5px;color:var(--muted);">AC42 arrives Delhi Aug 2 7:50pm IST · Window: Jul 30 ~8:20am MDT</div>
        </div>
      </div>
    </div>
    ${PRE_ARRIVAL_CONFIG.portals.map(p=>{
      const pd = TRAVELERS.every(t=>state.preArrival[p.key+'_'+t.id]);
      return '<div class="card" style="margin-bottom:12px;'+( pd?'border:1.5px solid #1a7a3c;':'')+'"><div style="font-size:14px;font-weight:800;color:var(--deep);margin-bottom:4px;">'+p.icon+' '+p.name+(pd?' ✅':'')+'</div><div style="font-size:12px;color:var(--muted);margin-bottom:8px;">'+p.desc+'</div><a href="'+p.url+'" target="_blank" style="display:block;text-align:center;padding:10px;background:'+(windowOpen?'#1a7a3c':'#e8e6df')+';color:'+(windowOpen?'#fff':'var(--deep)')+';border-radius:10px;font-size:12px;font-weight:700;text-decoration:none;margin-bottom:10px;">🌐 '+p.url.replace('https://','')+' '+(windowOpen?'— OPEN NOW ↗':'↗')+'</a><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">'+TRAVELERS.map(t=>{const td=!!state.preArrival[p.key+'_'+t.id];return '<button onclick="preArrivalToggle(\''+p.key+'\',\''+t.id+'\',document.getElementById(\'docsSectionContent\'))" style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;border:1.5px solid '+(td?'#1a7a3c':'var(--line)')+';background:'+(td?'#f0faf4':'var(--color-background-secondary,#f8f5ef)')+';cursor:pointer;text-align:left;"><span>'+(td?'✅':'⬜')+'</span><div><div style="font-size:12px;font-weight:700;color:'+(td?'#1a7a3c':'var(--deep)')+';">'+t.name+'</div><div style="font-size:10.5px;color:var(--muted);">'+(td?'Done ✓':'Not yet')+'</div></div></button>';}).join('')+'</div></div>';

function openPDFViewer(id, label){
  const data = VISA_PDFS[id];
  if(!data){ 
    showModal('📄 ' + label, '<div style="text-align:center;padding:16px;"><div style="font-size:40px;margin-bottom:12px;">📧</div><div style="font-size:14px;font-weight:700;color:var(--deep);margin-bottom:8px;">ETA PDF in your email</div><div style="font-size:13px;color:var(--muted);line-height:1.7;">Your India e-Visa ETA was sent to marc@bennettdental.com.<br><br>Your ETA and confirmation details are shown in the Docs → Visas tab.</div></div>'); 
    return; 
  }

  // Remove any existing viewer
  const existing = document.getElementById('pdfViewerOverlay');
  if(existing) existing.remove();

  const overlay = document.createElement('div');
  overlay.id = 'pdfViewerOverlay';
  overlay.style.cssText = `
    position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;
    display:flex;flex-direction:column;
    background:var(--color-background-primary,#fff);
  `;

  overlay.innerHTML = `
    <!-- Toolbar -->
    <div style="
      display:flex;align-items:center;gap:10px;
      padding:10px 14px;
      padding-top:max(14px,env(safe-area-inset-top));
      background:var(--deep,#1a2e4a);
      flex-shrink:0;
      min-height:54px;
    ">
      <button id="pdfClose" style="
        background:rgba(255,255,255,0.15);border:none;color:#fff;
        padding:7px 14px;border-radius:8px;font-size:13px;font-weight:700;
        cursor:pointer;white-space:nowrap;
      ">✕ Close</button>
      <div style="flex:1;text-align:center;">
        <div style="font-size:13px;font-weight:700;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${label}</div>
        <div style="font-size:10px;color:rgba(255,255,255,0.6);margin-top:1px;">India e-Visa · ETA Document</div>
      </div>
      <button id="pdfShare" style="
        background:rgba(255,255,255,0.15);border:none;color:#fff;
        padding:7px 12px;border-radius:8px;font-size:13px;font-weight:700;
        cursor:pointer;white-space:nowrap;
      ">↗ Forward</button>
      <button id="pdfPrint" style="
        background:var(--saffron,#e8731a);border:none;color:#fff;
        padding:7px 12px;border-radius:8px;font-size:13px;font-weight:700;
        cursor:pointer;white-space:nowrap;
      ">🖨️ Open to Print</button>
    </div>

    <!-- PDF frame -->
    <iframe
      id="pdfFrame"
      src="${data}"
      style="flex:1;border:none;width:100%;display:block;"
    ></iframe>

    <!-- Bottom bar -->
    <div style="
      display:flex;justify-content:center;gap:12px;
      padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom));
      background:var(--color-background-secondary,#f8f5ef);
      border-top:1px solid var(--line,#e0ddd5);
      flex-shrink:0;
    ">
      <button id="pdfCloseBottom" style="
        flex:1;max-width:180px;
        padding:11px;border:none;border-radius:12px;
        background:var(--deep,#1a2e4a);color:#fff;
        font-size:14px;font-weight:700;cursor:pointer;
      ">← Back to App</button>
    </div>
  `;

  document.body.appendChild(overlay);

  // Close handlers — all return to previous page
  function closeViewer(){
    overlay.remove();
    // Re-render current tab so the user lands back exactly where they were
    const activeBtn = document.querySelector('.tabs button.active');
    if(activeBtn){
      const tab = activeBtn.dataset.tab;
      const main = document.getElementById('main');
      if(tab==='docs') renderDocs(main);
      else renderApp();
    }
  }

  document.getElementById('pdfClose').addEventListener('click', closeViewer);
  document.getElementById('pdfCloseBottom').addEventListener('click', closeViewer);

  // Print
  document.getElementById('pdfPrint').addEventListener('click', ()=>{
    // iOS Safari: only reliable print method is opening the PDF as a blob URL in a new tab
    // The user then uses Safari's share/print button from there
    try {
      const base64 = data.split(',')[1];
      const byteStr = atob(base64);
      const bytes = new Uint8Array(byteStr.length);
      for(let i = 0; i < byteStr.length; i++) bytes[i] = byteStr.charCodeAt(i);
      const blob = new Blob([bytes], {type:'application/pdf'});
      const blobUrl = URL.createObjectURL(blob);
      window.open(blobUrl, '_blank');
      // Clean up after a delay
      setTimeout(()=> URL.revokeObjectURL(blobUrl), 30000);
    } catch(e) {
      // Fallback: open data URI directly
      window.open(data, '_blank');
    }
  });

  // Forward / Share
  document.getElementById('pdfShare').addEventListener('click', ()=>{
    if(navigator.share){
      // Convert base64 to Blob for sharing
      const byteStr = atob(data.split(',')[1]);
      const bytes = new Uint8Array(byteStr.length);
      for(let i=0;i<byteStr.length;i++) bytes[i]=byteStr.charCodeAt(i);
      const blob = new Blob([bytes],{type:'application/pdf'});
      const file = new File([blob], label.replace(/\s+/g,'_')+'_India_eVisa.pdf',{type:'application/pdf'});
      navigator.share({ files:[file], title: label + ' — India e-Visa' })
        .catch(()=>fallbackDownload());
    } else {
      fallbackDownload();
    }

    function fallbackDownload(){
      const a = document.createElement('a');
      a.href = data;
      a.download = label.replace(/\s+/g,'_') + '_India_eVisa.pdf';
      a.click();
    }
  });
}

function openDocForm(doc){
  const isEdit = !!doc;
  const cat = catInfo(docsCatFilter);
  const bg = document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML = `
    <div class="modal">
      <button class="close-x" id="closeModal">✕</button>
      <h3>${isEdit? 'Edit':'Add'} ${cat.label} — ${travelerName(docsTravelerFilter)}</h3>
      <label class="field">Title / label</label>
      <input id="f_title" value="${doc?.title||''}" placeholder="e.g. Air Canada YYC→YYZ">
      <label class="field">Date</label>
      <input id="f_date" type="date" value="${doc?.date||''}">
      <label class="field">Reference / confirmation #</label>
      <input id="f_ref" value="${doc?.refNumber||''}" placeholder="Booking / PNR / passport #">
      <label class="field">Notes</label>
      <textarea id="f_notes" placeholder="Seat #, hotel address, gate, etc.">${doc?.notes||''}</textarea>
      <label class="field">Photo (passport page, ticket, confirmation email)</label>
      <input id="f_photo" type="file" accept="image/*" capture="environment">
      <div id="photoPreviewWrap"></div>
      <div class="modal-actions">
        ${isEdit? '<button class="btn danger" id="deleteDoc">Delete</button>' : ''}
        <button class="btn secondary" id="cancelDoc">Cancel</button>
        <button class="btn" id="saveDoc">Save</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  if(doc?.photoId){
    idbGet(doc.photoId).then(blob=>{
      if(blob){ const url = URL.createObjectURL(blob); document.getElementById('photoPreviewWrap').innerHTML = `<img src="${url}" style="width:100%;border-radius:10px;margin-top:8px;">`; }
    });
  }
  bg.querySelector('#closeModal').onclick = ()=>bg.remove();
  bg.querySelector('#cancelDoc').onclick = ()=>bg.remove();
  if(isEdit){
    bg.querySelector('#deleteDoc').onclick = async ()=>{
      if(doc.photoId) await idbDelete(doc.photoId);
      state.documents = state.documents.filter(x=>x.id!==doc.id);
      saveState(); bg.remove(); renderDocList(); showToast('Deleted');
    };
  }
  bg.querySelector('#saveDoc').onclick = async ()=>{
    const title = document.getElementById('f_title').value.trim();
    const date = document.getElementById('f_date').value;
    const ref = document.getElementById('f_ref').value.trim();
    const notes = document.getElementById('f_notes').value.trim();
    const fileInput = document.getElementById('f_photo');
    let photoId = doc?.photoId || null;
    if(fileInput.files && fileInput.files[0]){
      const blob = await resizeImage(fileInput.files[0]);
      photoId = photoId || uid();
      await idbPut(photoId, blob);
    }
    if(isEdit){
      Object.assign(doc, {title, date, refNumber:ref, notes, photoId});
    } else {
      state.documents.push({id:uid(), traveler:docsTravelerFilter, category:docsCatFilter, title, date, refNumber:ref, notes, photoId});
    }
    saveState(); bg.remove(); renderDocList(); showToast('Saved');
  };
}

function openGuide(key){
  const g = GUIDES.find(x=>x.key===key);
  window.speechSynthesis && window.speechSynthesis.cancel();
  player = { stops:g.stops, index:0, playing:false, guideKey:key };
  const main = document.getElementById('main');
  main.innerHTML = `
    <button class="btn ghost" onclick="renderTours(document.getElementById('main'))">‹ All tours</button>
    <h2 class="section-title" style="margin-top:8px">${g.emoji} ${g.title}</h2>
    <p class="muted" style="margin-top:-8px">📍 ${g.loc}</p>
    <div class="card" id="stopsCard">${g.stops.map((s,i)=>`
      <div class="guide-stop" id="stop-${i}">
        <h4>${i+1}. ${s.h}</h4>
        <p>${s.t}</p>
      </div>`).join('')}
    </div>
    <div class="player-bar">
      <button id="prevBtn" title="Previous">⏮</button>
      <button id="playBtn" class="big" title="Play/Pause">▶</button>
      <button id="stopBtn" title="Stop">⏹</button>
      <button id="nextBtn" title="Next">⏭</button>
    </div>
  `;
  document.getElementById('playBtn').onclick = togglePlay;
  document.getElementById('stopBtn').onclick = stopGuideAudio;
  document.getElementById('nextBtn').onclick = ()=>jumpStop(1);
  document.getElementById('prevBtn').onclick = ()=>jumpStop(-1);
  highlightStop(0);
}

function highlightStop(i){
  document.querySelectorAll('.guide-stop').forEach((el,idx)=>el.classList.toggle('current', idx===i));
  const el = document.getElementById('stop-'+i);
  if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
}

function speakStop(){
  if(!('speechSynthesis' in window)){ showToast('Voice playback not supported on this browser'); return; }
  if(player.index >= player.stops.length){ player.playing=false; updatePlayIcon(); return; }
  const s = player.stops[player.index];
  const utter = new SpeechSynthesisUtterance(s.t);
  utter.rate = 0.95;
  utter.onend = ()=>{ if(player.playing){ player.index++; highlightStop(player.index); speakStop(); } };
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utter);
}
function togglePlay(){
  if(!('speechSynthesis' in window)){ showToast('Voice playback not supported on this browser'); return; }
  if(player.playing){
    player.playing = false;
    window.speechSynthesis.pause();
  } else {
    player.playing = true;
    if(window.speechSynthesis.paused){ window.speechSynthesis.resume(); }
    else { highlightStop(player.index); speakStop(); }
  }
  updatePlayIcon();
}
function stopGuideAudio(){
  player.playing=false; player.index=0;
  window.speechSynthesis && window.speechSynthesis.cancel();
  highlightStop(0); updatePlayIcon();
}
function jumpStop(delta){
  window.speechSynthesis && window.speechSynthesis.cancel();
  player.index = Math.max(0, Math.min(player.stops.length-1, player.index+delta));
  highlightStop(player.index);
  if(player.playing) speakStop();
}
function updatePlayIcon(){
  const btn = document.getElementById('playBtn'); if(!btn) return;
  btn.textContent = player.playing ? '⏸' : '▶';
}

          <a href="tel:${e.phone.replace(/\s/g,'')}" style="font-size:12px;font-weight:700;color:var(--saffron);text-decoration:none;">📞 ${e.phone}</a>
        </div>
      `).join('')}
    </div>

    <!-- Canadian Embassy Egypt -->
    <div class="card" style="margin-bottom:10px;">
      <div style="font-size:14px;font-weight:800;color:var(--deep);margin-bottom:10px;">🍁 Canadian Mission in Egypt</div>
      ${ARRIVAL_DATA.canadianMissionsEgypt.map(e=>`
        <div style="padding:8px 0;border-bottom:0.5px solid var(--line);">
          <div style="font-size:13px;font-weight:700;color:var(--ink);">${e.name}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px;">📍 ${e.address}</div>
          ${e.email ? `<div style="font-size:12px;color:var(--muted);">✉️ ${e.email}</div>` : ''}
          <div style="font-size:11.5px;color:${e.note.includes('24/7') ? '#1a7a3c' : 'var(--muted)'};margin-top:2px;">${e.note}</div>
          <a href="tel:${e.phone.replace(/\s/g,'')}" style="font-size:12px;font-weight:700;color:var(--saffron);text-decoration:none;">📞 ${e.phone}</a>
        </div>
      `).join('')}
    </div>

    <!-- US Embassies India -->
    <div class="card" style="margin-bottom:4px;">
      <div style="font-size:14px;font-weight:800;color:var(--deep);margin-bottom:10px;">🇺🇸 U.S. Embassies & Consulates in India</div>
      ${ARRIVAL_DATA.embassies.map(e=>`
        <div style="padding:8px 0;border-bottom:0.5px solid var(--line);">
          <div style="font-size:13px;font-weight:700;color:var(--ink);">${e.name}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px;">📍 ${e.address}</div>
          <a href="tel:${e.phone.replace(/\s/g,'')}" style="font-size:12px;font-weight:700;color:var(--saffron);text-decoration:none;">📞 ${e.phone}</a>
        </div>
      `).join('')}
    </div>
  `;
}

function renderInfo(main){
  main.innerHTML = `
    <h2 class="section-title">Packing checklist</h2>
    <div class="card" id="checklistCard">
      ${PACKING.map((item,i)=>{
        const key = 'pk'+i;
        const checked = !!state.checklist[key];
        return `<label class="checklist-item ${checked?'checked':''}"><input type="checkbox" data-key="${key}" ${checked?'checked':''}><span>${item}</span></label>`;
      }).join('')}
    </div>

    <h2 class="section-title">Emergency & embassy info</h2>
    <div class="card info-block">
      <p><b>Rising Star Outreach (Bihar contact)</b> — add your on-the-ground contact name/number here once confirmed.</p>
      <h4>India</h4>
      <ul>
        <li>Canadian High Commission, New Delhi — +91 11 4178 2000</li>
        <li>US Embassy, New Delhi — +91 11 2419 8000</li>
        <li>National emergency number (police/fire/medical): 112</li>
      </ul>
      <h4>Egypt</h4>
      <ul>
        <li>Canadian Embassy, Cairo — +20 2 2461 2200</li>
        <li>US Embassy, Cairo — +20 2 2797 3300</li>
        <li>Tourist & Antiquities Police: 126 · General emergency: 122</li>
      </ul>
      <p class="muted">Double-check these numbers closer to departure — save them directly into each traveler's phone contacts too.</p>
    </div>

    <h2 class="section-title">Quick reference</h2>
    <div class="card info-block">
      <h4>Electrical plugs</h4>
      <p>India: Type C/D/M, 230V · Egypt: Type C/F, 220V. A universal adapter with USB ports covers both — devices marked "INPUT 100-240V" don't need a voltage converter.</p>
      <h4>Currency</h4>
      <p>India: Indian Rupee (INR), cash useful outside big cities. Egypt: Egyptian Pound (EGP), but most attractions and hotels are card-only in 2026 — bring Visa/Mastercard and keep small EGP notes for tips.</p>
    </div>

    <h2 class="section-title">Backup your data</h2>
    <div class="card">
      <p class="muted" style="margin-top:0">Every phone stores its own copy of documents and notes. Use Export to save a backup file (including photos), and Import to load it on another device or restore it later.</p>
      <div class="modal-actions" style="margin-top:10px">
        <button class="btn secondary" id="exportBtn">⬇ Export backup</button>
        <button class="btn" id="importBtn">⬆ Import backup</button>
      </div>
      <input type="file" id="importFile" accept="application/json" style="display:none">
    </div>
  `;
  document.getElementById('checklistCard').addEventListener('change', e=>{
    const input = e.target.closest('input[type=checkbox]'); if(!input) return;
    state.checklist[input.dataset.key] = input.checked;
    saveState();
    input.closest('.checklist-item').classList.toggle('checked', input.checked);
  });
  document.getElementById('exportBtn').onclick = exportBackup;
  document.getElementById('importBtn').onclick = ()=>document.getElementById('importFile').click();
  document.getElementById('importFile').addEventListener('change', e=>{
    if(e.target.files[0]) importBackup(e.target.files[0]);
  });
}

async function exportBackup(){
  showToast('Preparing backup…');
  const docsWithPhotos = await Promise.all(state.documents.map(async doc=>{
    if(doc.photoId){
      const blob = await idbGet(doc.photoId);
      const photoData = blob ? await blobToBase64(blob) : null;
      return {...doc, photoData};
    }
    return doc;
  }));
  const bundle = {...state, documents:docsWithPhotos, exportedAt:new Date().toISOString()};
  const blob = new Blob([JSON.stringify(bundle)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `family-travel-backup-${todayISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('Backup downloaded');
}

async function importBackup(file){
  try{
    const text = await file.text();
    const bundle = JSON.parse(text);
    const docs = await Promise.all((bundle.documents||[]).map(async doc=>{
      if(doc.photoData){
        const blob = dataURLToBlob(doc.photoData);
        const photoId = doc.photoId || uid();
        await idbPut(photoId, blob);
        const {photoData, ...rest} = doc;
        return {...rest, photoId};
      }
      return doc;
    }));
    state = { documents:docs, checklist:bundle.checklist||{}, seenWelcome:true };
    saveState();
    showToast('Backup imported');
    render();
  }catch(err){
    showToast('Could not read that backup file');
  }
}

/* ============ INIT ============ */
render();
</script>
