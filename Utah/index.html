<style>
  :root{
    --saffron:#0062b8; --gold:#8fb3d9; --deep:#002e5d; --deep2:#0a3f78;
    --paper:#f5f8fb; --card:#ffffff; --ink:#22252b; --muted:#6b7280; --line:#d8e2ec;
    --good:#2f7d5c; --danger:#b3452f; --radius:16px; --soft:#eef3f8; --tint:#e1ebf6; --hero2:#0062b8;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(180deg,var(--deep) 0%, var(--deep) 120px, var(--paper) 120px);color:var(--ink);min-height:100%;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--paper);}
  header.topbar{padding:calc(14px + env(safe-area-inset-top,0px)) 18px 14px;color:#fff;background:linear-gradient(135deg,var(--deep),var(--deep2));position:sticky;top:0;z-index:20;}
  header.topbar h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.2px;}
  header.topbar .sub{font-size:12.5px;opacity:.85;margin-top:3px;}
  main{flex:1;padding:14px 14px calc(90px + var(--safe-bottom));}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;display:flex;background:#fff;border-top:1px solid var(--line);
    padding-bottom:var(--safe-bottom);box-shadow:0 -4px 16px rgba(0,0,0,.06);z-index:30;}
  nav.tabs button{flex:1;border:none;background:none;padding:9px 2px 8px;font-size:10.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;font-family:inherit;}
  nav.tabs button .ic{font-size:19px;}
  nav.tabs button.active{color:var(--saffron);}
  h2.section-title{font-size:17px;margin:18px 0 10px;color:var(--deep);}
  h2.section-title:first-child{margin-top:2px;}
  .card{background:var(--card);border-radius:var(--radius);padding:14px 15px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid var(--line);}
  .pill{display:inline-block;background:var(--tint);color:var(--saffron);font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;margin-right:6px;}
  .pill.green{background:#e4f2ea;color:var(--good);}
  .pill.blue{background:#e6eefc;color:#2454a3;}
  .pill.red{background:#fde8e3;color:var(--danger);}
  .muted{color:var(--muted);font-size:12.5px;}
  .btn{border:none;background:var(--deep);color:#fff;padding:10px 14px;border-radius:12px;font-size:13.5px;font-weight:700;font-family:inherit;text-decoration:none;display:inline-block;text-align:center;}
  .btn.secondary{background:#f0ece1;color:var(--deep);}
  .btn.ghost{background:none;color:var(--saffron);padding:6px 8px;}
  .btn.block{display:block;width:100%;}
  .btn-row{display:flex;gap:8px;margin-top:10px;}
  .btn-row .btn{flex:1;}
  textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#fff;color:var(--ink);font-family:inherit;resize:vertical;min-height:70px;}
  .chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;-webkit-overflow-scrolling:touch;}
  .chip{flex:none;padding:8px 13px;border-radius:20px;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--muted);font-family:inherit;}
  .chip.active{background:var(--deep);color:#fff;border-color:var(--deep);}
  .theme-opt{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-family:inherit;text-align:left;}
  .theme-opt.active{border:2px solid var(--saffron);}
  .theme-opt .sw{display:flex;flex:none;border-radius:8px;overflow:hidden;border:1px solid rgba(0,0,0,.08);}
  .theme-opt .sw i{display:block;width:16px;height:30px;}
  .theme-opt .nm{font-size:13.5px;font-weight:700;color:var(--ink);}
  .theme-opt .ds{font-size:11.5px;color:var(--muted);}
  .day-card .date{font-size:11.5px;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:.4px;}
  .day-card h3{margin:2px 0 4px;font-size:15.5px;color:var(--deep);}
  .day-card .loc{font-size:12.5px;color:var(--muted);margin-bottom:6px;}
  .day-card p{font-size:13.5px;line-height:1.45;margin:6px 0;}
  .tips{margin:8px 0 0;padding:0;list-style:none;}
  .tips li{font-size:12.5px;line-height:1.4;padding:5px 0 5px 20px;position:relative;color:#3a3d44;}
  .tips li:before{content:"✓";position:absolute;left:0;color:var(--good);font-weight:900;}
  .tips.warn li:before{content:"!";color:var(--danger);}
  .label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--saffron);margin-bottom:8px;}
  .sched{border-left:2px solid var(--saffron);padding-left:12px;}
  .sched div.s{display:flex;gap:10px;margin-bottom:8px;align-items:flex-start;}
  .sched div.s:last-child{margin-bottom:0;}
  .sched .t{min-width:68px;font-size:11px;font-weight:700;color:var(--saffron);padding-top:1px;white-space:nowrap;}
  .sched .a{font-size:12.5px;line-height:1.4;}
  .bk{display:flex;align-items:center;gap:8px;width:100%;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px;text-align:left;font-family:inherit;color:inherit;}
  .bk .e{font-size:16px;}
  .bk .b{flex:1;min-width:0;}
  .bk .b1{font-size:12px;font-weight:700;color:var(--deep);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bk .b2{font-size:11px;color:var(--muted);}
  .bk .go{color:var(--saffron);font-size:14px;}
  .leg{background:var(--soft);border-radius:12px;padding:10px 12px;margin-bottom:8px;}
  .leg .h{font-size:11px;font-weight:800;color:var(--saffron);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;}
  .leg .r{display:flex;align-items:center;gap:8px;}
  .leg .r > div{flex:1;}
  .leg .city{font-size:13px;font-weight:700;color:var(--deep);}
  .leg .tm{font-size:12px;color:var(--muted);}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12.5px;line-height:1.4;}
  .kv dt{color:var(--muted);font-weight:600;}
  .kv dd{margin:0;color:var(--ink);font-weight:600;word-break:break-word;}
  .ref{font-family:ui-monospace,Menlo,monospace;font-size:13px;letter-spacing:.5px;background:var(--tint);color:var(--deep);padding:1px 6px;border-radius:6px;}
  .alert{background:#fde8e3;border:1px solid #f2c3b8;border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.45;color:#6d2a1c;margin:8px 0;}
  .alert b{color:var(--danger);}
  .banner{background:#fff7ea;border:1px solid #f0dcae;border-radius:14px;padding:12px 14px;font-size:12.5px;line-height:1.5;margin-bottom:12px;color:#5a4a1f;}
  .banner b{color:#8a5c0a;}
  .traveler-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px;}
  .traveler-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700;color:var(--deep);}
  .traveler-card .r{font-weight:500;color:var(--muted);font-size:11.5px;}
  .ql{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;padding:10px;font-size:14px;font-weight:600;color:var(--ink);text-align:left;border-radius:10px;font-family:inherit;}
  .ql .x{margin-left:auto;color:var(--muted);}
  .count{display:flex;gap:8px;margin:10px 0 2px;}
  .count div{flex:1;background:var(--soft);border-radius:10px;padding:8px 4px;text-align:center;}
  .count b{display:block;font-size:22px;color:var(--deep);}
  .count span{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
  .checklist-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px;}
  .checklist-item:first-child{border-top:none;}
  .checklist-item input{width:19px;height:19px;flex:none;accent-color:var(--good);}
  .checklist-item.checked span{text-decoration:line-through;color:var(--muted);}
  .wx{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);}
  .wx:first-child{border-top:none;}
  .wx .d{width:78px;font-size:12.5px;font-weight:700;color:var(--deep);}
  .wx .i{font-size:22px;width:30px;text-align:center;}
  .wx .c{flex:1;font-size:12px;color:var(--muted);}
  .wx .t{font-size:13px;font-weight:700;text-align:right;white-space:nowrap;}
  .place h3{margin:0 0 2px;font-size:15px;color:var(--deep);}
  .place p{font-size:13px;line-height:1.45;margin:6px 0 8px;}
  .contact{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13px;gap:10px;}
  .contact:first-child{border-top:none;}
  .contact a{font-weight:700;white-space:nowrap;}
  a{color:var(--saffron);}
  .modal-bg{position:fixed;inset:0;z-index:9000;display:flex;flex-direction:column;background:rgba(0,0,0,.45);}
  .modal-bg .spacer{flex:1;min-height:60px;}
  .sheet{background:#fff;border-radius:20px 20px 0 0;max-height:85vh;display:flex;flex-direction:column;max-width:520px;width:100%;margin:0 auto;}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--line);}
  .sheet-head span{font-size:15px;font-weight:800;color:var(--deep);}
  .sheet-head button{background:var(--soft);border:none;border-radius:50%;width:30px;height:30px;font-size:15px;}
  .sheet-body{overflow-y:auto;padding:14px 16px calc(20px + var(--safe-bottom));-webkit-overflow-scrolling:touch;}
  .toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#22252b;color:#fff;padding:10px 18px;border-radius:30px;font-size:13px;z-index:9999;box-shadow:0 4px 14px rgba(0,0,0,.25);}
</style>

function applyTheme(key){
  const t = THEMES[key] || THEMES.cougar, r = document.documentElement.style;
  [['--deep','deep'],['--deep2','deep2'],['--hero2','hero2'],['--saffron','saffron'],['--gold','gold'],['--paper','paper'],['--soft','soft'],['--tint','tint'],['--line','line']].forEach(([v,k])=>r.setProperty(v,t[k]));
  const m = document.querySelector('meta[name=theme-color]'); if(m) m.setAttribute('content', t.deep);
}
function setTheme(key){ state.theme = key; saveState(); applyTheme(key); render(); toast(THEMES[key].name); }
function themePickerHtml(){
  const cur = state.theme || 'cougar';
  return Object.entries(THEMES).map(([k,t])=>`<button class="theme-opt ${k===cur?'active':''}" onclick="setTheme('${k}')">
    <span class="sw"><i style="background:${t.deep}"></i><i style="background:${t.hero2}"></i><i style="background:${t.saffron}"></i><i style="background:${t.gold}"></i><i style="background:${t.paper}"></i></span>
    <span style="flex:1"><div class="nm">${t.name}</div><div class="ds">${t.desc}</div></span>${k===cur?'<span style="color:var(--saffron);font-weight:800">✓</span>':''}</button>`).join('');
}

/* ============ STATE ============ */
const STORE_KEY = 'utahTrip2026State';
function defaultState(){ return {checks:{}, journal:{}}; }
function loadState(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || defaultState(); }catch(e){ return defaultState(); } }
function saveState(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }
let state = loadState();

/* ============ HELPERS ============ */
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function localISO(d){ d = d || new Date(); const z = new Date(d.getTime() - d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }
function fmtDate(iso){ const d = new Date(iso + 'T12:00:00'); return d.toLocaleDateString('en-CA',{weekday:'long', month:'short', day:'numeric'}); }
function shortDate(iso){ const d = new Date(iso + 'T12:00:00'); return d.toLocaleDateString('en-CA',{weekday:'short', month:'short', day:'numeric'}); }
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),1800); }
function telLink(n){ return 'tel:' + n.replace(/[^0-9+]/g,''); }

/* ============ ROUTER ============ */
let activeTab = 'home';
document.getElementById('tabs').addEventListener('click', e=>{
  const b = e.target.closest('button[data-tab]'); if(!b) return;

function goTab(tab){
  activeTab = tab;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));

}

  const kv = `<dl class="kv" style="margin:12px 0">${b.details.map(d=>`<dt>${d[0]}</dt><dd>${d[1]}</dd>`).join('')}</dl>`;

    return `<div class="card"><span class="pill">Countdown to takeoff</span>
      <div class="count"><div><b>${d}</b><span>days</span></div><div><b>${h}</b><span>hours</span></div><div><b>${m}</b><span>min</span></div></div>
      <p class="muted" style="margin:8px 0 0">Fri Oct 9 · AC 4159 departs Edmonton at 3:17pm</p></div>`;

    const today = ITINERARY.find(d=>d.date===localISO());

        <textarea data-k="q${i}" placeholder="Write here…">${esc(entry['q'+i]||'')}</textarea>`).join('')}
      <label style="display:block;font-size:12.5px;font-weight:700;color:var(--deep);margin:10px 0 5px">Anything else?</label>
      <textarea data-k="notes" placeholder="Notes, funny moments, quotes…">${esc(entry.notes||'')}</textarea>
      <button class="btn block" style="margin-top:12px" onclick="saveJournal()">Save entry</button>
      <p class="muted" style="margin:8px 0 0">Entries are saved on this phone only.</p>
    </div>`;
}
function saveJournal(){
  const e = {}; document.querySelectorAll('#main textarea').forEach(t=>{ if(t.value.trim()) e[t.dataset.k]=t.value; });
  state.journal[journalPerson] = state.journal[journalPerson] || {};
  state.journal[journalPerson][journalDay] = e; saveState(); toast('Saved ✓');
}

/* ============ WEATHER ============ */
const WMO = {0:['☀️','Clear'],1:['🌤️','Mostly clear'],2:['⛅','Partly cloudy'],3:['☁️','Cloudy'],45:['🌫️','Fog'],48:['🌫️','Fog'],51:['🌦️','Light drizzle'],53:['🌦️','Drizzle'],55:['🌦️','Drizzle'],61:['🌧️','Light rain'],63:['🌧️','Rain'],65:['🌧️','Heavy rain'],71:['🌨️','Light snow'],73:['🌨️','Snow'],75:['❄️','Heavy snow'],80:['🌦️','Showers'],81:['🌧️','Showers'],82:['⛈️','Heavy showers'],95:['⛈️','Thunderstorms'],96:['⛈️','Thunderstorms'],99:['⛈️','Thunderstorms']};
function renderWeather(main){
  main.innerHTML = `<h2 class="section-title">🌤️ Orem / Provo forecast</h2>
    <div class="card" id="wxCard"><p class="muted" style="margin:0">Loading the live forecast…</p></div>
    <div class="card" style="background:#f0f7ff">
      <div style="font-size:13px;font-weight:800;color:var(--deep);margin-bottom:6px">🍁 Mid-October in Utah County</div>
      <div style="font-size:12.5px;color:var(--muted);line-height:1.7">
        <div>• Days are usually mild and sunny; nights are cool, often near freezing</div>
        <div>• It's dry — bring lip balm and a water bottle</div>
        <div>• Canyons and the Alpine Loop are colder and can see early snow</div>
      </div></div>
    <a class="btn block" href="https://forecast.weather.gov/MapClick.php?lat=40.2969&lon=-111.6946" target="_blank" rel="noopener">US National Weather Service — Orem ↗</a>`;
  const url = 'https://api.open-meteo.com/v1/forecast?latitude=40.2969&longitude=-111.6946&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=America%2FDenver&forecast_days=16';
  fetch(url).then(r=>r.json()).then(j=>{
    const d = j.daily; if(!d) throw new Error('no data');
    const rows = d.time.map((t,i)=>({t, code:d.weather_code[i], hi:d.temperature_2m_max[i], lo:d.temperature_2m_min[i], p:d.precipitation_probability_max[i]}))
      .filter(r=>r.t>='2026-10-09' && r.t<='2026-10-14');
    const card = document.getElementById('wxCard'); if(!card) return;
    if(!rows.length){ card.innerHTML = `<p class="muted" style="margin:0">The trip-day forecast isn't available yet — check back closer to Oct 9.</p>`; return; }
    const c2f = c=>Math.round(c*9/5+32);
    card.innerHTML = rows.map(r=>{ const w = WMO[r.code] || ['🌡️','—'];
      return `<div class="wx"><div class="d">${shortDate(r.t)}</div><div class="i">${w[0]}</div>
        <div class="c">${w[1]}${r.p!=null?` · ${r.p}% precip`:''}</div>
        <div class="t">${Math.round(r.hi)}° / ${Math.round(r.lo)}°C<div class="muted" style="font-size:11px;font-weight:600">${c2f(r.hi)}° / ${c2f(r.lo)}°F</div></div></div>`; }).join('') +
      `<p class="muted" style="margin:8px 0 0;font-size:11px">Live forecast from Open-Meteo · updates each time you open this tab</p>`;
  }).catch(()=>{
    const card = document.getElementById('wxCard');
    if(card) card.innerHTML = `<p class="muted" style="margin:0">Couldn't load the forecast (no connection?). Use the National Weather Service link below.</p>`;
  });
}

/* ============ INFO ============ */
function checklistHtml(list){
  return list.map(i=>{ const on = !!state.checks[i.id];
    return `<label class="checklist-item ${on?'checked':''}"><input type="checkbox" ${on?'checked':''} onchange="toggleCheck('${i.id}',this.checked)"><span>${i.t}</span></label>`; }).join('');
}
function toggleCheck(id,on){ state.checks[id]=on; saveState(); render(); }
function renderInfo(main){
  const done = CHECKLIST.filter(i=>state.checks[i.id]).length;
  const contacts = [
    ["Value Park (YEG parking)","780-890-8527"],
    ["Hampton Inn & Suites Orem","801-426-8500"],
    ["GotRentalCars (Thrifty booking)","1-855-264-9782"],
    ["Air Canada","1-888-247-2262"],
    ["Alaska Airlines","1-800-252-7522"],
    ["trivago DEALS (hotel booking)","1-475-251-4340"],
    ["Emergency (US)","911"]
  ];
  main.innerHTML = `<h2 class="section-title">✅ Trip checklist <span class="muted" style="font-weight:600">${done}/${CHECKLIST.length}</span></h2>
    <div class="card" style="padding:6px 14px">${checklistHtml(CHECKLIST)}</div>
    <h2 class="section-title">🧳 Packing</h2>
    <div class="card" style="padding:6px 14px">${checklistHtml(PACKING)}</div>
    <h2 class="section-title">📞 Contacts</h2>
    <div class="card" style="padding:4px 14px">${contacts.map(c=>`<div class="contact"><span>${c[0]}</span><a href="${telLink(c[1])}">${c[1]}</a></div>`).join('')}</div>
    <h2 class="section-title">🇺🇸 Good to know</h2>
    <div class="card"><ul class="tips">
      <li>Canadians need a valid passport to fly into the US. US customs is done at Edmonton before you board.</li>
      <li>Utah is on Mountain Time — the same as Edmonton. Seattle is one hour behind.</li>
      <li>Coming home after 48+ hours away, each person can bring back up to CA$800 in goods duty-free.</li>
      <li>Use the CBSA Advance Declaration (in the ArriveCAN app or the airport kiosks) when you land at YEG.</li>
      <li>Tipping is expected in US restaurants — about 15–20%.</li>
    </ul></div>
    <h2 class="section-title" id="themes">🎨 App colours</h2>
    <p class="muted" style="margin:-4px 2px 10px">Tap a scheme to try it. Your choice is saved on this phone only.</p>
    ${themePickerHtml()}
    <button class="btn secondary block" style="margin-top:6px" onclick="resetChecks()">Reset checklists</button>`;
}
function resetChecks(){ if(confirm('Clear all the checkmarks on this phone?')){ state.checks={}; saveState(); render(); } }

applyTheme(state.theme);
render();
setInterval(()=>{ if(activeTab==='home' && !document.getElementById('appModal')) render(); }, 60000);
</script>
